# to check license REUSE compliance:
# uvx reuse lint

version = 1

[[annotations]]
path = [
    "**/.gitignore",
    "AGENTS.md",
    "docs/briques/**",
    "packages/*/.python-version",
    "packages/*/pyproject.toml",
    "packages/*/README.md",
    "packages/**/README.md",
    "packages/*/uv.lock",
    "packages/pac-bdd/.opencode/opencode.jsonc",
    "packages/pac-bdd/AGENTS.md",
    "README.md",
    "report/pac-bdd/**",
    "report/pac0/**",
    "**/.env.template",
]
SPDX-FileCopyrightText = "Philippe ENTZMANN <philippe@entzmann.name>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# All external public reference ressources
[[annotations]]
path = [
    "docs/developpement/**",
    "docs/norme/**",
    "docs/test/**",
    ".github/issue_template/*.md",
    "docker/**/*.md",
    "seaweedfs-config.json",
    "**/docker-compose.yml",
    "**/my-file.txt",
]
SPDX-FileCopyrightText = "Various public contributors"
SPDX-License-Identifier = "any-OSI"
