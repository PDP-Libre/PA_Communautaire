      - venv_08_transmission_fiscale:/app/.venv

  09-gestion-cycle-vie:
    build:
      context: .
      dockerfile: Dockerfile.09-gestion-cycle-vie
    image: git.pdplibre.org/construction_pa/09-gestion-cycle-vie:dev
    container_name: pac09-gestion-cycle-vie
    environment:
      - HOST_UID=${UID:-1000}
      - HOST_GID=${GID:-1000}
    env_file:
